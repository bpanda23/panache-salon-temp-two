  <section class="services-hero-section">
    <video autoplay loop muted playsinline class="hero-video-bg">

    <div class="hero-video-overlay"></div>
    <div class="container">
      <div class="row justify-content-center text-center">
        <div class="col-md-8 ftco-animate">
          <div class="hero-subtitle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
              style="margin-right: 8px;">
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" fill="#d8c397" />
            </svg>
            PREMIUM SERVICES

            From haircuts to facials, explore our comprehensive range of luxury beauty services with transparent
            pricing.
          </p>
        </div>

  <!-- Sticky Services Navigation Bar -->
  <div class="services-nav-wrapper" id="servicesNavWrapper">
    <div class="container">
      <div class="services-nav-scroll">
        <button class="service-nav-btn active" data-target="service-design">
          <span class="btn-text">Beard and Shaving</span>
          <div class="btn-indicator"></div>
        </button>
        <button class="service-nav-btn" data-target="hair-styling">
          <span class="btn-text">Hair Styling</span>
          <div class="btn-indicator"></div>
        </button>
        <button class="service-nav-btn" data-target="hair-coloring">
          <span class="btn-text">Hair Coloring</span>
          <div class="btn-indicator"></div>
        </button>
        <button class="service-nav-btn" data-target="hair-wellness">
          <span class="btn-text">Hair Wellness</span>
          <div class="btn-indicator"></div>
        </button>
        <button class="service-nav-btn" data-target="skin-care">
          <span class="btn-text">Skin Care</span>
          <div class="btn-indicator"></div>
        </button>
        <button class="service-nav-btn" data-target="nail-care">
          <span class="btn-text">Nail Care</span>
          <div class="btn-indicator"></div>
        </button>
      </div>
    </div>
  </div>
  
  <script>
    // Smooth scroll and active state management for the new buttons
    document.addEventListener("DOMContentLoaded", function() {
      const buttons = document.querySelectorAll(".service-nav-btn");
      buttons.forEach(button => {
        button.addEventListener("click", function() {
          buttons.forEach(btn => btn.classList.remove("active"));
          this.classList.add("active");
          // Here you can add logic to filter/scroll to the respective section
        });
      });
    });
  </script>
